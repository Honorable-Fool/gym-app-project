services:
  db:
    image: postgres:16-alpine
    container_name: gym_postgres_db
    restart: always
    environment:
      POSTGRES_USER: gym_admin
      POSTGRES_PASSWORD: dev_secret_password
      POSTGRES_DB: gym_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: